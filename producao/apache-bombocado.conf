# Raiz do Bom Bocado: a pasta public do Laravel (o app fica na raiz, sem subcaminho).
<Directory /app/sistema/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
ServerName localhost
# Nao anunciar versoes do Apache e do PHP.
ServerTokens Prod
ServerSignature Off

# O service worker nunca fica em cache: uma versao nova do app chega na hora.
<Files "sw.js">
    Header set Cache-Control "no-cache"
</Files>
<Files "manifest.webmanifest">
    Header set Content-Type "application/manifest+json"
</Files>
