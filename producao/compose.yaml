# Bom Bocado em producao (notebook VPS-Claude, WSL2). Subir/atualizar: producao/publicar.ps1.
# Senha do banco: segredos\compose.env (fora do Git), lida com --env-file.
# Publicado na internet pelo Tailscale Funnel, que repassa para 127.0.0.1:8095.
name: receitas-producao

x-app: &app
  image: receitas-producao:latest
  restart: unless-stopped
  environment:
    TZ: America/Sao_Paulo
  volumes:
    - /mnt/c/Receitas-producao/codigo:/app
    - /mnt/c/Receitas-producao/segredos:/segredos:ro
    - /mnt/c/Receitas-producao/backup:/backup
    # Fotos das receitas e dos perfis: fora da pasta do codigo, para o git e as publicacoes nao mexerem nelas.
    - /mnt/c/Receitas-producao/fotos:/app/sistema/storage/app/public
  depends_on:
    banco:
      condition: service_healthy

services:
  web:
    <<: *app
    build: .
    # So no proprio notebook (127.0.0.1): quem vem da internet entra pelo Funnel.
    ports:
      - "127.0.0.1:8095:80"

  # Fila de trabalhos (leitura dos links e IA na Fase 7). So o web constroi a imagem.
  fila:
    <<: *app
    pull_policy: never
    user: www-data
    depends_on:
      banco:
        condition: service_healthy
      web:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=120"]

  agendador:
    <<: *app
    pull_policy: never
    user: www-data
    depends_on:
      banco:
        condition: service_healthy
      web:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

  banco:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${BANCO_SENHA_ROOT}
      TZ: America/Sao_Paulo
    volumes:
      - dados-banco:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dados-banco:
